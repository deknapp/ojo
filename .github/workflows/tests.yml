name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      # The suite is deliberately offline. Everything it checks -- parsing the
      # city's sentences, matching street names across two spelling
      # conventions, refusing to confuse Airport Road with Old Airport Road --
      # is pure logic, so CI never depends on Overpass being up.
      - run: pytest -q
