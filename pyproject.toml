[project]
name = "ojo"
version = "0.1.0"
description = "Where automated speed and noise enforcement is, in northern and central New Mexico"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "osmium>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ojo = "ojo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ojo*"]
